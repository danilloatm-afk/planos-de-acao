<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planos de Ação</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="band">
  <div class="band-inner">
    <div class="band-text">
      <h1>Planos de Ação</h1>
      <p>Projetos, etapas e histórico de documentos</p>
    </div>
    <button class="btn btn-ghost" onclick="toggleForm('formNovoProjeto')">+ Novo projeto</button>
  </div>
</div>

<div class="wrap">

  <form id="formNovoProjeto" class="inline-form hidden" onsubmit="criarProjeto(event)" style="margin-bottom:24px;">
    <div>
      <label>Nome do projeto</label>
      <input type="text" id="novoNome" placeholder="Ex: Saneamento do Cadastro de Produtos" required>
    </div>
    <div>
      <label>Descrição (opcional)</label>
      <textarea id="novaDescricao" placeholder="Contexto e objetivo do projeto"></textarea>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-outline btn-sm" onclick="toggleForm('formNovoProjeto')">Cancelar</button>
      <button type="submit" class="btn btn-primary btn-sm">Criar projeto</button>
    </div>
  </form>

  <div id="projectsGrid" class="projects-grid"></div>
  <div id="empty" class="empty" style="display:none;">
    Nenhum projeto ainda. Clique em "+ Novo projeto" para criar o primeiro plano de ação.
  </div>

</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>initIndex();</script>
</body>
</html>
